name: price-watch

# No cron here: Google Cloud Scheduler dispatches this workflow every 5 minutes (see README).
on:
  workflow_dispatch:

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check prices and notify new drops
        env:
          SERVICE__CONFIG__READER__TOPIC: ${{ secrets.NTFY_TOPIC }}
          SERVICE__HISTORY__TOPIC: ${{ secrets.NTFY_TOPIC }}
          SERVICE__NOTIFIER_FACTORY__NOTIFIER__TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python -m train_ticket_prices.ntfy_watch
