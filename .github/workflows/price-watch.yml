name: price-watch

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 6-22 * * *"
  workflow_dispatch:

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check prices and notify new drops
        env:
          WATCH__CONFIG__TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH__HISTORY__TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH__NOTIFIER__TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python -m train_ticket_prices.ntfy_watch
