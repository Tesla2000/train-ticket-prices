name: price-watch

on:
  schedule:
    # Cron runs in UTC: 06:00-22:55 UTC is about 07:00-23:55 Warsaw in winter and 08:00-00:55 in summer.
    - cron: "*/5 6-22 * * *"
  workflow_dispatch:

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check prices and notify new drops
        env:
          WATCH__CONFIG__TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH__HISTORY__TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH__NOTIFIER__TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: uv run python -m train_ticket_prices.ntfy_watch
